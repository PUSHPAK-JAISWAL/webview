name: CI macOS

on:
  workflow_call:

jobs:
  setup:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: webview
      - name: Setup V
        run: |
          curl -Lo v_macos_arm64.zip https://github.com/vlang/v/releases/latest/download/v_macos_arm64.zip
          unzip -o v_macos_arm64.zip
          mv v ~/v && ~/v/v symlink
      - name: Setup V module
        run: |
          mkdir -p ~/.vmodules/pushpak_jaiswal && mv webview ~/.vmodules/pushpak_jaiswal/webview
      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/v
            ~/.vmodules
          key: ${{ runner.os }}-${{ github.sha }}

  test:
    needs: setup
    runs-on: macos-latest
    env:
      VFLAGS: -cg -cc clang
    steps:
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/v
            ~/.vmodules
          key: ${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Setup V
        run: ~/v/v symlink && v -showcc self && v doctor
      - name: L1 unit tests
        run: v -stats test ~/.vmodules/pushpak_jaiswal/webview/tests/l1/
      - name: L2 integration tests
        run: v -stats test -run-only 'test_fn_call*,test_get_js_arg,test_return_value_to_js,test_return_value_from_threaded_task_to_js,test_static_server_serves_index_over_http' ~/.vmodules/pushpak_jaiswal/webview/tests/l2/
      - name: Build examples
        run: |
          for example_dir in $(find ~/.vmodules/pushpak_jaiswal/webview/examples/* -maxdepth 0 -type d); do
            cmd="v $example_dir/"
            [[ "$example_dir" =~ .*"emoji-picker"$ ]] && cmd+="main.v"
            echo "$cmd"
            eval "$cmd"
          done
